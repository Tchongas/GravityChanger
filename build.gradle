plugins {
	id 'fabric-loom' version '0.10-SNAPSHOT'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = project.archives_base_name
version = "${project.mod_version}-${project.minecraft_version}"

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

}

sourceSets {
	main {
		java {
			include "me/andrew/gravitychanger/*.java"
			include "me/andrew/gravitychanger/accessor/**"
			include "me/andrew/gravitychanger/api/**"
			include "me/andrew/gravitychanger/command/**"
			include "me/andrew/gravitychanger/config/**"
			include "me/andrew/gravitychanger/item/**"
			include "me/andrew/gravitychanger/util/**"
			include "me/andrew/gravitychanger/mixin/BlockItemMixin.java"
			include "me/andrew/gravitychanger/mixin/CommandManagerMixin.java"
			include "me/andrew/gravitychanger/mixin/DirectionMixin.java"
			include "me/andrew/gravitychanger/mixin/EntityMixin.java"
			include "me/andrew/gravitychanger/mixin/EntityShapeContextMixin.java"
			include "me/andrew/gravitychanger/mixin/ItemMixin.java"
			include "me/andrew/gravitychanger/mixin/ItemUsageContextMixin.java"
			include "me/andrew/gravitychanger/mixin/LivingEntityMixin.java"
			include "me/andrew/gravitychanger/mixin/PlayerEntityMixin.java"
			include "me/andrew/gravitychanger/mixin/PlayerManagerMixin.java"
			include "me/andrew/gravitychanger/mixin/ServerPlayNetworkHandlerMixin.java"
			include "me/andrew/gravitychanger/mixin/ServerPlayerEntityMixin.java"
			include "me/andrew/gravitychanger/mixin/ServerPlayerInteractionManagerMixin.java"
			include "me/andrew/gravitychanger/mixin/client/CameraMixin.java"
			include "me/andrew/gravitychanger/mixin/client/ClientPlayNetworkHandlerMixin.java"
			include "me/andrew/gravitychanger/mixin/client/ClientPlayerEntityMixin.java"
			include "me/andrew/gravitychanger/mixin/client/EntityRenderDispatcherMixin.java"
			include "me/andrew/gravitychanger/mixin/client/EntityRenderMixin.java"
			include "me/andrew/gravitychanger/mixin/client/GameRendererMixin.java"
			include "me/andrew/gravitychanger/mixin/client/InGameOverlayRendererMixin.java"
			include "me/andrew/gravitychanger/mixin/client/OtherClientPlayerEntityMixin.java"
			include "me/andrew/gravitychanger/mixin/client/PlayerEntityRendererMixin.java"
		}
	}
}

processResources {
	inputs.property "version", project.mod_version

	filesMatching("fabric.mod.json") {
		expand "version": project.mod_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

jar {
	from "LICENSE"
}
